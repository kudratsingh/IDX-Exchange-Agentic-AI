[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idx_agent"
description = "Real-estate assistant over MLS listing and sold data, behind typed tools."
readme = "README.md"
requires-python = ">=3.11"
# Runtime: the MCP SDK (2.x API: MCPServer), pydantic for every boundary model, and
# PyMySQL (pure Python) for the SELECT-only data layer.
dependencies = ["mcp>=2.2,<3", "pydantic>=2.11,<3", "pymysql>=1.1,<3"]
dynamic = ["version"]

[project.optional-dependencies]
# Spans to a local collector (WO-007, ADR-0006); OTLP over HTTP, so no compiled gRPC.
# Below 1.45: that release moves the HTTP exporter off the requests library, which the
# exporter session in observability/tracing.py is built on (CI broke 2026-09-25; the
# move to the new transport is a WO-007 Status item).
tracing = [
    "opentelemetry-sdk>=1.30,<1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<1.45",
]
# Semantic search (WO-010, ADR-0007): NumPy for the index and ranking, the OpenAI
# client for embeddings. Both ship binary wheels; imported only on first use.
semantic = [
    "numpy>=1.26,<3",
    "openai>=1.40,<3",
]
# Document answers (WO-012, ADR-0009): pypdf reads the two PDFs at build time; the
# index and the hybrid route's query embedder use the semantic extra.
rag = [
    "pypdf>=4,<7",
    "idx_agent[semantic]",
]
dev = [
    # CI tests the spans with the SDK's in-memory exporter; no collector needed.
    "idx_agent[tracing]",
    # CI tests the ranking and the embedder's request shape against a stub client.
    "idx_agent[semantic]",
    # CI tests the chunker, a one-page PDF's extraction, and the index build.
    "idx_agent[rag]",
    "pytest",
    # Keep in step with the ruff-pre-commit rev in .pre-commit-config.yaml so CI's
    # `ruff format --check` and the pre-commit hook agree.
    "ruff==0.16.8",
    "pre-commit",
]

[tool.setuptools.dynamic]
version = { attr = "idx_agent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The valid city names (one per line) ship with the domain package.
"idx_agent.domain" = ["cities.txt"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The gate scripts carry long user-facing messages and are not edited to satisfy
# lint (RULES.md); the formatter still owns their layout.
"scripts/gates/*.py" = ["E501"]
# The guard tests hold literal shell commands; wrapping them would hide what is tested.
"tests/test_guards.py" = ["E501"]
# The profiler holds SQL statements and markdown table rows that read better on one line.
"scripts/profile_data.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers"
markers = [
    "db: needs a MySQL database; skipped when MYSQL_HOST is unset",
]
