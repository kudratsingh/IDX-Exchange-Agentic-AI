# Routing and mixed-intent eval cases (WO-013). Format: docs/EVALUATION.md, "Routing
# cases"; the contract each expected route comes from: docs/ROUTING.md.
#
# Every `route_exact` case is `local`: the model is shown the tool server's
# instructions, every skill in the idx agent's skill list (name and description, then
# each body, in config order), and all six tool
# schemas, and each tool call it makes is answered with a fixed stub that holds no data.
# The check compares the tools called, in order, with `expect.route` ([] means no tool
# call), and each non-empty `expect.filters` item with that step's arguments, as
# `filters_subset` does (search's `mode`, and every argument of a search in `update`
# mode, are compared as sent). A case that accepts more than one route lists them in
# `expect.route_any_of`, each option's subsets in `expect.filters_any_of`; it passes
# when the calls equal any one option. No tool body runs, no database is read, nothing
# is embedded. Each case is up to 4 paid chat calls, so the suite runs only under a
# human `paid` token for that run.
#
# `history` holds earlier turns in own words: the user's message, the tool call that
# answered it (`tool_calls`, invented arguments, no sender id) with the result text it
# got back (`tool_result`), and the reply the assistant relayed. The driver sends each
# turn as the model saw it live: the user message, the call, the tool's result (the
# text as the message of an ok envelope, {"ok": true, "message": ...}), then the
# reply. Listing numbers are invented fixture keys (9 then 5-6 digits); prices in
# text are written with commas. Cities are real, public place names.
#
# Each row of docs/ROUTING.md has a case: one whose `input` is the row's example
# message (compared lower-cased, spaces and punctuation collapsed), or one whose `note`
# starts with "row: <the row's intent>" (tests/test_routing_contract.py).
#
# Decisions for this file (the WO's defaults, which the human let stand on 2026-09-25,
# and that day's injection rule): a route step may pin an argument subset; "what will
# prices do next year?" is declined (route []); an email request is declined with no
# tool call; an injected instruction is declined, and a call on the real request beside
# it is allowed but not required (case 019).

# --- single intent: one skill, one tool ----------------------------------------------

- id: routing-local-001
  category: routing
  suite: local
  input: "Are you working?"
  expect:
    route: [health]
  check: route_exact

- id: routing-local-002
  category: routing
  suite: local
  input: "3-bedroom homes in Pasadena under $1.5M"
  expect:
    route: [search_listings]
    filters: [{city: Pasadena, min_beds: 3, max_price: 1500000}]
  check: route_exact

- id: routing-local-003
  category: routing
  suite: local
  input: "How is the condo market in Glendale?"
  expect:
    route: [get_market_stats]
    filters: [{city: Glendale, property_subtype: Condominium}]
  check: route_exact

- id: routing-local-004
  category: routing
  suite: local
  input: "A quiet craftsman with a big yard in Altadena"
  expect:
    route: [find_similar_listings]
    filters: [{city: Altadena}]
  check: route_exact

# The question text is the model's own paraphrase, so no argument is pinned.
- id: routing-local-005
  category: routing
  suite: local
  input: "What does DOM mean?"
  expect:
    route: [rag_answer]
  check: route_exact

# Exact criteria and no descriptive words: this stays with search, never
# similar-listings ("not for exact criteria alone").
- id: routing-local-006
  category: routing
  suite: local
  input: "2-bedroom condos in Glendale under $800,000 with a pool"
  expect:
    route: [search_listings]
    filters:
      - {city: Glendale, min_beds: 2, max_price: 800000, property_subtype: Condominium, pool: true}
  check: route_exact
  note: "row: A new search by criteria (exact criteria stay with search)"

# --- mixed intent: each part to its own skill, in the order asked --------------------

- id: routing-local-007
  category: routing
  suite: local
  input: "Homes in Pasadena, and how is the market there?"
  expect:
    route: [search_listings, get_market_stats]
    filters: [{city: Pasadena}, {city: Pasadena}]
  check: route_exact

# A definition, then a place's number: docs-qa first, then market-stats.
- id: routing-local-008
  category: routing
  suite: local
  input: "What is DOM, and what is it in Pasadena?"
  expect:
    route: [rag_answer, get_market_stats]
    filters: [{}, {city: Pasadena}]
  check: route_exact
  note: "row: A mixed message (a definition, then a place's figure)"

- id: routing-local-009
  category: routing
  suite: local
  input: "Find condos in Glendale and tell me what sale-to-list means"
  expect:
    route: [search_listings, rag_answer]
    filters: [{city: Glendale, property_subtype: Condominium}, {}]
  check: route_exact
  note: "row: A mixed message (a search, then a definition)"

# "The second one" points at the earlier search result, so recommend gets its key and
# k 0 (the price check alone). The market part comes first because it was asked first.
- id: routing-local-010
  category: routing
  suite: local
  history:
    - user: "Homes in Monrovia"
      tool_calls:
        - {name: search_listings, arguments: {city: Monrovia}}
      tool_result: >-
        Showing 2 active listings on page 1, as of 2026-09-18. 1. Listing
        9130008: a house at $849,000, 3 beds, 2 baths. 2. Listing 9130009: a house
        at $1,249,000, 4 beds, 3 baths. Applied filters: city Monrovia.
      assistant: |-
        Showing 2 active listings on page 1, as of 2026-09-18

        1. Listing 9130008: a house at $849,000, 3 beds, 2 baths

        2. Listing 9130009: a house at $1,249,000, 4 beds, 3 baths

        Filters: city Monrovia
  input: "How is the market in Monrovia, and is the second one priced right?"
  expect:
    route: [get_market_stats, recommend]
    filters: [{city: Monrovia}, {listing_key: 9130009, k: 0}]
  check: route_exact
  note: "row: A mixed message (market figures, then a price check)"

# The pair of routing-local-007 in the reverse order: the order follows the message.
- id: routing-local-011
  category: routing
  suite: local
  input: "How is the market in Pasadena, and show me homes there under $1.2M"
  expect:
    route: [get_market_stats, search_listings]
    filters: [{city: Pasadena}, {city: Pasadena, max_price: 1200000}]
  check: route_exact
  note: "row: A mixed message (the reverse order)"

