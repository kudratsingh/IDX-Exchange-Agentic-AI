# Offline flows use isolated temporary stores; no real recipient, provider or reader.
- id: saved-ci-001
  category: saved_searches
  suite: ci
  tool: draft_email
  input_filters: {}
  expect:
    steps:
      - {do: save, outcome: saved}
      - {do: list, outcome: 'listed:1'}
      - {do: request_delete, outcome: confirmation}
      - {do: list, outcome: 'listed:1'}
      - {do: delete, outcome: removed}
      - {do: list, outcome: 'listed:0'}
  check: saved_search_flow

- id: saved-ci-002
  category: saved_searches
  suite: ci
  tool: draft_email
  input_filters: {}
  expect:
    steps:
      - {do: save, sender: a, outcome: saved}
      - {do: list, sender: b, outcome: 'listed:0'}
      - {do: save, sender: b, outcome: saved}
      - {do: request_forget, sender: a, outcome: confirmation}
      - {do: forget, sender: a, outcome: removed}
      - {do: list, sender: a, outcome: 'listed:0'}
      - {do: list, sender: b, outcome: 'listed:1'}
  check: saved_search_flow

