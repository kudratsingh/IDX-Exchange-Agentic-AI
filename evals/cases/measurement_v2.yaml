# WO-028 measurement set, version 2. Format: docs/EVALUATION.md "Measurement cases".
#
# A separate, versioned set: version 1 (evals/cases/measurement.yaml) and its split
# hash never change. Questions in our own words over the synthetic fixture, for the
# figures version 1 did not cover: the market card's readings and monthly trend, the
# opt-in extended figures (`include_extended`), and the comparable-sales price check
# (`recommend` with `k: 0`). The facts are written by
# `python -m evals.measurement --write-goldens --set 2` from the independent SQL in
# evals/truth/sql.py over the committed fixture rows; never edit them by hand.
# tests/test_measurement_v2.py and the ci suite fail when a fact here and the truth
# SQL disagree. Splits: `heldout` cases are never used to edit skills, tool
# descriptions or prompts; changing a held-out case starts a new set version.
# Figures whose definition WO-028 found ambiguous are not asserted (see
# STOPPED_KINDS in evals/truth/sql.py and the work order).
- id: meas2-001
  set_version: 2
  category: measurement_v2
  suite: ci
  check: measurement
  split: dev
  family: market
  database: fixture
  input: Is San Gabriel a buyer's or a seller's market right now?
  expect:
    route:
    - get_market_stats
    args:
      city: San Gabriel
    facts:
      market_lean: balanced
      dom_band: low
      median_dom: 27.0
      sale_to_list_ratio: 0.998
- id: meas2-002
  set_version: 2
  category: measurement_v2
  suite: ci
  check: measurement
  split: heldout
  family: market
  database: fixture
