# Document-answer eval cases (WO-012). Format: docs/EVALUATION.md; notes: evals/README.md.
#
# `ci` cases call the rag_answer tool body (`rag_result`) with `input_filters`: no model,
# no database, no provider. The runner builds the fixture document index once per run
# (tests/rag_fixture.py, lexical route, in a temporary directory) and points the tool at
# it through IDX_RAG_INDEX_DIR. Its sources: the invented, own-words field reference and
# primer under tests/fixtures/docs/ (standing in for the two PDFs, which are never read
# here) and the tracked docs/data/schema_notes.md and docs/data/glossary.md. Its BM25
# not-found floor is 5.89 (see tests/rag_fixture.py for why).
#
# Chunk ids are `doc#key`: `trestle#<FieldName>` for a fixture field entry,
# `primer#s<N>` (`s<N>.<part>` past 350 words) for a fixture primer section by position,
# `schema_notes#<table>` for a table summary, `schema_notes#sec<N>` for a numbered
# section (a slug for an unnumbered one), `glossary#<term slug>` for a glossary entry.
# The fixture primer puts the ratio at section 3 and days on market at section 8, the
# positions the alias table names for the real Primer.
#
# Every `chunks_from` case pins the whole top list (`exact: true`), and
# tests/test_rag_cases.py recomputes each literal from the corpus with the real
# chunker and retrieval, so a literal and the code cannot drift apart (requirement 9).
# Exact-name hits (a field name or an alias in the question) come first; BM25 fills the
# rest.
#
# The fixture field reference holds two entries that must never be indexed: an agent
# contact field (ListAgentEmail, described by the marker SENTINEL-AGENT-CONTACT-QX7) and
# a deny-listed field (ShowingInstructions, marker SENTINEL-DENY-LISTED-KV3). Its
# PublicRemarks entry holds a line naming ShowingInstructions (removed at build time)
# and an instruction-like line starting "SYSTEM OVERRIDE". Every value here is invented
# or a column name; nothing is text from the reference PDFs.
#
# `local` cases: a model fills the tool from the user's words and the tool runs against
# the real index the settings name (IDX_RAG_INDEX_DIR, under data/). Each is a paid chat
# call, plus a paid embedding call on the hybrid index: a human `paid` token for the run.

# --- ci: the three set questions ------------------------------------------------------

# DOM: the alias "DOM" names the DaysOnMarket field entry and primer section 8 (exact);
# BM25 adds the glossary entry and schema notes section 7 (our stored value vs a
# derived one).
- id: rag-ci-001
  category: rag
  suite: ci
  tool: rag_answer
  input_filters: {question: "what does DOM mean?"}
  expect:
    sources: [trestle#DaysOnMarket, primer#s8, glossary#days_on_market, schema_notes#sec7]
    top: 4
    exact: true
  check: chunks_from

# The sold table: the alias "sold table" names the california_sold summary (exact).
- id: rag-ci-002
  category: rag
  suite: ci
  tool: rag_answer
  input_filters: {question: "which columns does the sold table have?"}
  expect:
    sources:
      [schema_notes#california_sold, schema_notes#decisions, glossary#as_of_dates, schema_notes#sec1]
    top: 4
    exact: true
  check: chunks_from

# The summary passage lists all 49 names in the notes' order, one per line, contact
# columns included, and the migration's three date columns marked as ours (decision 8);
# tests/test_rag_cases.py checks the names against schema notes section 2.
- id: rag-ci-003
  category: rag
  suite: ci
  tool: rag_answer
  input_filters: {question: "which columns does the sold table have?"}
  expect:
    pattern: "The california_sold table has 49 columns\\. [^\\n]*\\n\
      ListingKey\\nViewYN\\nWaterfrontYN\\nBasementYN\\nPoolPrivateYN\\n\
      OriginalListPrice\\nCloseDate\\nClosePrice\\nListAgentFirstName\\n\
      ListAgentLastName\\nLatitude\\nLongitude\\nUnparsedAddress\\nPropertyType\\n\
      LivingArea\\nListPrice\\nDaysOnMarket\\nListOfficeName\\nBuyerOfficeName\\n\
      ListAgentFullName\\nBuyerAgentFirstName\\nBuyerAgentLastName\\n\
      AttachedGarageYN\\nParkingTotal\\nPropertySubType\\nLotSizeAcres\\n\
      SubdivisionName\\nYearBuilt\\nBathroomsTotalInteger\\nCity\\nBedroomsTotal\\n\
      PurchaseContractDate\\nListingContractDate\\nStateOrProvince\\n\
      MiddleOrJuniorSchool\\nFireplaceYN\\nStories\\nHighSchool\\nLevels\\n\
      MainLevelBedrooms\\nNewConstructionYN\\nGarageSpaces\\nHighSchoolDistrict\\n\
      PostalCode\\nAssociationFee\\nLotSizeSquareFeet\\n\
      close_date_d \\(ours, added by the migration\\)\\n\
      purchase_contract_date_d \\(ours, added by the migration\\)\\n\
      listing_contract_date_d \\(ours, added by the migration\\)\\n```"
  check: regex

# The ratio: the alias "list-to-close" names the glossary entry and primer section 3
# (exact); BM25 adds two schema-notes chunks.
- id: rag-ci-004
  category: rag
  suite: ci
  tool: rag_answer
  input_filters: {question: "what is the list-to-close ratio?"}
  expect:
    sources:
      [glossary#sale_to_list_ratio, primer#s3, schema_notes#california_sold, schema_notes#decisions]
    top: 4
    exact: true
  check: chunks_from

# The ratio passages give WO-008's definition: close price over the final list price
# (the fixture primer's words) and ClosePrice by ListPrice, the final asking price (the
# glossary's).
- id: rag-ci-005
  category: rag
  suite: ci
  tool: rag_answer
  input_filters: {question: "what is the list-to-close ratio?"}
  expect:
    pattern: "(?s)(?=.*close price over the final list price)\
      (?=.*divide `ClosePrice`\\s+by `ListPrice`, the final asking price)"
  check: regex

# The term mismatch: "sale to list" reaches the same two exact passages as
# "list-to-close" (rag-ci-004), in the same order.
- id: rag-ci-006
  category: rag
  suite: ci
  tool: rag_answer
  input_filters: {question: "what is the sale to list ratio?"}
  expect: {sources: [glossary#sale_to_list_ratio, primer#s3], top: 2, exact: true}
  check: chunks_from

