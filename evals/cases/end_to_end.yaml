# End-to-end cases (WO-014): the 25-message WhatsApp demo script, turned into routing
# cases. Format and checks: docs/EVALUATION.md, "Routing cases" and "End-to-end cases".
#
# The 25 `local` cases are the script's messages, in the order they are sent, each a
# `route_exact` case run the way the routing suite runs (every skill, every tool, stub
# results, up to 4 paid chat calls each, so only under a human `paid` token). Each
# expected route comes from the CURRENT routing contract, docs/ROUTING.md, and each
# case's `note` is "row: <the row's intent>", written exactly as the row names it. Where
# the WO's draft table predates the contract, the contract wins: "show me more" right
# after the search's own result is the search's `more` mode; after market figures or a
# document answer it is a clarifying question and no call (decision 7); "what did you
# search for?" makes no call.
#
# `history` holds only the earlier turns a message depends on, written in own words
# and in the same shape as evals/cases/routing.yaml: the user's message, the call that
# answered it (invented arguments, no sender id), the result text it got back, and the
# reply the assistant relayed. A turn that makes no call (a clarifying question, a
# plain answer) is left out unless the message depends on it. Listing numbers are
# invented fixture keys (9 then 5-6 digits); prices in text carry commas. The script's
# own messages stay as the operator types them (lower case).
#
# The one `manual` case is the live run: the same 25 messages, the two alternates
# outside the count, and what to record per turn. tests/test_end_to_end_cases.py ties
# the two halves together and each case to its contract row.

# --- 1 to 7: health, then a search and its follow-ups -------------------------------

