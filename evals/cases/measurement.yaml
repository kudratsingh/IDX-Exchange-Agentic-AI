# WO-020 measurement set, version 1. Format: docs/EVALUATION.md "Measurement cases".
#
# Questions in our own words over the synthetic fixture. Each case names the expected
# route, the expected arguments (checked through the tool's own validator) and answer
# facts. The facts are written by `python -m evals.measurement --write-goldens` from the
# independent SQL in evals/truth/sql.py over the committed fixture rows; never edit them
# by hand. tests/test_measurement.py and the ci suite fail when a fact here and the truth
# SQL disagree. Splits: `heldout` cases are never used to edit skills, tool descriptions
# or prompts; changing a held-out case starts a new set version. Market cases under the
# 5-sale minimum assert only the sample count (the card's figures may then be None).
- id: meas-001
  category: measurement
  suite: ci
  check: measurement
  split: dev
  family: search
  database: fixture
  input: How many homes are for sale in Los Angeles?
  expect:
    route:
    - search_listings
    args:
      city: Los Angeles
    facts:
      total_matches: 52
- id: meas-002
  category: measurement
  suite: ci
  check: measurement
  split: heldout
