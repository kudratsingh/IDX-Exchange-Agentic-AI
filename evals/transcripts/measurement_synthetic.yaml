- id: syn-011
  label: synthetic
  scenario: multi-turn market follow-up narrows the window
  turns:
  - user: How is the San Gabriel housing market?
    expect:
      family: market
      route: [get_market_stats]
      args: {city: San Gabriel}
      facts: [median_close_price, sample_count, market_lean]
    calls:
    - {tool: get_market_stats, args: {city: San Gabriel}, result: truth}
    final: >-
      Over the last six months {sample_count} homes sold in San Gabriel at a median
      of ${median_close_price:,}; the market reads as {market_lean}.
    want:
      scores: {route: 1, args: 1, answer: 1}
      support: {supported: 1, unsupported: 0, ungrounded: 0}
  - user: And over the last 3 months?
    expect:
      family: market
      route: [get_market_stats]
      args: {city: San Gabriel, months: 3}
      facts: [median_close_price, sample_count]
    calls:
    - {tool: get_market_stats, args: {city: San Gabriel, months: 3}, result: truth}
    final: >-
      Over the last 3 months the median was ${median_close_price:,} from
      {sample_count} sales.
    want:
      scores: {route: 1, args: 1, answer: 1}
      support: {supported: 1, unsupported: 0, ungrounded: 0}
