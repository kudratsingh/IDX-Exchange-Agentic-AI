# WO-028 recorded transcripts for the measurement scorer. SYNTHETIC: hand-written in
# our own words, never produced by a model, never sent to one. They exercise the four
# scores (route, args, tool-result facts, answer support) on multi-turn and failure
# behaviour; tests/test_measurement_v2.py scores every turn and compares the result
# with `want`. Format: docs/EVALUATION.md "Measurement set version 2".
#
# Each turn names what it expects (`expect`: family, route, args, fact kinds); the
# expected facts come from the truth SQL over the committed fixture at test time. A
# call's `result` is `truth` (the truth facts for that call's own arguments),
# `{truth: true, override: {...}}` (a wrong figure in the tool result),
# `{clarification: <question>}`, or `{ok: false, message: <text>}` (unavailable).
# `final` is the assistant's final prose; `{kind}` names an expected fact and
# `{got.kind}` the last call's reported fact. A turn without `final` has no prose,
# so its answer support is not measured.
- id: syn-001
  label: synthetic
  scenario: right answer, single turn
  turns:
  - user: How many homes are for sale in Pasadena?
    expect:
      family: search
      route: [search_listings]
      args: {city: Pasadena}
      facts: [total_matches]
    calls:
    - {tool: search_listings, args: {city: Pasadena}, result: truth}
    final: There are {total_matches} homes for sale in Pasadena right now.
    want:
      scores: {route: 1, args: 1, answer: 1}
      support: {supported: 1, unsupported: 0, ungrounded: 0}
- id: syn-002
  label: synthetic
  scenario: follow-up refinement carries the city forward
  turns:
  - user: How many homes are for sale in Pasadena?
    expect:
      family: search
      route: [search_listings]
      args: {city: Pasadena}
      facts: [total_matches]
    calls:
    - {tool: search_listings, args: {city: Pasadena}, result: truth}
    final: There are {total_matches} homes for sale in Pasadena right now.
    want:
      scores: {route: 1, args: 1, answer: 1}
      support: {supported: 1, unsupported: 0, ungrounded: 0}
  - user: Only the ones with at least 3 bedrooms, please.
    expect:
      family: search
      route: [search_listings]
      args: {city: Pasadena, min_beds: 3}
      facts: [total_matches]
    calls:
    - {tool: search_listings, args: {city: Pasadena, min_beds: 3}, result: truth}
    final: '{total_matches} of them have 3 or more bedrooms.'
    want:
      scores: {route: 1, args: 1, answer: 1}
      support: {supported: 1, unsupported: 0, ungrounded: 0}
- id: syn-003
  label: synthetic
  scenario: follow-up refinement drops the carried city
  turns:
  - user: Only the ones with at least 3 bedrooms, please.
    expect:
      family: search
      route: [search_listings]
      args: {city: Pasadena, min_beds: 3}
      facts: [total_matches]
    calls:
    - tool: search_listings
      args: {min_beds: 3}
      result: {clarification: 'Which city or ZIP code should I search?'}
    final: Which city or ZIP code should I search?
    want:
      scores: {route: 1, args: 0, answer: 0}
      support: {supported: 1, unsupported: 0, ungrounded: 0}
