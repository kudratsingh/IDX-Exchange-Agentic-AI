# Commit gates (see RULES.md). Install once:  pip install pre-commit && pre-commit install
# Bump the ruff rev here and the ruff pin in pyproject.toml together.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: forbidden-paths
        name: "gate 1: forbidden paths (data, context, coordination, dumps, env, PDFs)"
        entry: python3 scripts/gates/forbidden_paths.py
        language: system
        pass_filenames: true
      - id: confidential-text
        name: "gate 2: no handbook / Primer / Trestle text"
        entry: python3 scripts/gates/confidential_text.py
        language: system
        types: [text]
      - id: pii-scan
        name: "gate 3: no emails or phone numbers"
        entry: python3 scripts/gates/pii_scan.py
        language: system
        types: [text]
